<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pushup Counter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
    }

    /* Big remaining count */
    .remaining {
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #fff;
      transition: color 0.3s;
    }

    .remaining.done {
      color: #22c55e;
    }

    .progress-bar-wrap {
      width: min(400px, 90vw);
      height: 6px;
      background: #2a2a2a;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #ef4444);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.4rem;
    }

    /* Log section */
    .log-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .qty-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover { background: #2a2a2a; border-color: #555; }
    .qty-btn:active { background: #333; }

    #qty {
      width: 90px;
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      background: transparent;
      border: none;
      border-bottom: 2px solid #333;
      color: #fff;
      outline: none;
      padding: 0.2rem;
      transition: border-color 0.2s;
    }

    #qty:focus { border-color: #f97316; }

    /* Remove arrows on number input */
    #qty::-webkit-outer-spin-button,
    #qty::-webkit-inner-spin-button { -webkit-appearance: none; }
    #qty[type=number] { -moz-appearance: textfield; }

    .log-btn {
      padding: 1rem 3rem;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(249,115,22,0.35);
    }

    .log-btn:hover { opacity: 0.9; }
    .log-btn:active { transform: scale(0.97); }
    .log-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Done banner */
    .done-banner {
      display: none;
      font-size: 1.2rem;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: 0.05em;
    }

    .done-banner.visible { display: block; }

    /* Settings */
    details {
      width: min(400px, 90vw);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 0;
      background: #141414;
    }

    summary {
      padding: 0.9rem 1.2rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    summary::after { content: '▸'; transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(90deg); }

    .settings-body {
      padding: 0 1.2rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .settings-body label {
      font-size: 0.8rem;
      color: #666;
    }

    .settings-row {
      display: flex;
      gap: 0.5rem;
    }

    .settings-body input[type=number] {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      padding: 0.55rem 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .settings-body input[type=number]:focus { border-color: #f97316; }
    .settings-body input::-webkit-outer-spin-button,
    .settings-body input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .settings-body input[type=number] { -moz-appearance: textfield; }

    .save-btn {
      padding: 0.55rem 1.1rem;
      border: none;
      border-radius: 8px;
      background: #f97316;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .save-btn:hover { opacity: 0.85; }

    .reset-btn {
      background: transparent;
      border: 1px solid #333;
      border-radius: 8px;
      color: #666;
      font-size: 0.8rem;
      padding: 0.45rem 1rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      align-self: flex-start;
    }

    .reset-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* Flash animation */
    @keyframes flash {
      0%   { opacity: 1; }
      50%  { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .flash { animation: flash 0.3s ease; }
  </style>
</head>
<body>

  <h1>Pushup Goal</h1>

  <div class="remaining" id="remaining">0</div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:0.4rem;">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progressLabel">0 / 0 done</div>
  </div>

  <div class="done-banner" id="doneBanner">Goal reached! 🎉</div>

  <div class="log-section">
    <p style="color:#666; font-size:0.85rem; letter-spacing:0.05em; text-transform:uppercase;">Push-ups just done</p>
    <div class="qty-row">
      <button class="qty-btn" id="minus">−</button>
      <input type="number" id="qty" value="10" min="1" max="9999" />
      <button class="qty-btn" id="plus">+</button>
    </div>
    <button class="log-btn" id="logBtn">Log Push-ups</button>
  </div>

  <details id="settingsPanel">
    <summary>Settings</summary>
    <div class="settings-body">
      <label for="goalInput">Total goal (push-ups)</label>
      <div class="settings-row">
        <input type="number" id="goalInput" placeholder="e.g. 5000" min="1" />
        <button class="save-btn" id="saveGoalBtn">Save</button>
      </div>
      <button class="reset-btn" id="resetBtn">Reset progress</button>
    </div>
  </details>

  <script>
    const STORAGE_KEY = 'pushup_state';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return { goal: 5000, done: 0 };
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = loadState();

    const remainingEl  = document.getElementById('remaining');
    const progressBar  = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const doneBanner   = document.getElementById('doneBanner');
    const qtyInput     = document.getElementById('qty');
    const logBtn       = document.getElementById('logBtn');
    const goalInput    = document.getElementById('goalInput');
    const saveGoalBtn  = document.getElementById('saveGoalBtn');
    const resetBtn     = document.getElementById('resetBtn');
    const minusBtn     = document.getElementById('minus');
    const plusBtn      = document.getElementById('plus');

    function render() {
      const remaining = Math.max(0, state.goal - state.done);
      const pct = state.goal > 0 ? Math.min(100, (state.done / state.goal) * 100) : 0;

      remainingEl.textContent = remaining.toLocaleString();
      remainingEl.classList.toggle('done', remaining === 0);
      progressBar.style.width = pct + '%';
      progressLabel.textContent = `${state.done.toLocaleString()} / ${state.goal.toLocaleString()} done`;
      doneBanner.classList.toggle('visible', remaining === 0);
      logBtn.disabled = remaining === 0;
      goalInput.value = state.goal;
    }

    function flashRemaining() {
      remainingEl.classList.remove('flash');
      void remainingEl.offsetWidth; // reflow
      remainingEl.classList.add('flash');
    }

    logBtn.addEventListener('click', () => {
      const qty = parseInt(qtyInput.value, 10);
      if (!qty || qty < 1) return;
      state.done = Math.min(state.goal, state.done + qty);
      saveState(state);
      flashRemaining();
      render();
    });

    minusBtn.addEventListener('click', () => {
      const v = parseInt(qtyInput.value, 10) || 1;
      qtyInput.value = Math.max(1, v - 1);
    });

    plusBtn.addEventListener('click', () => {
      const v = parseInt(qtyInput.value, 10) || 0;
      qtyInput.value = Math.min(9999, v + 1);
    });

    saveGoalBtn.addEventListener('click', () => {
      const newGoal = parseInt(goalInput.value, 10);
      if (!newGoal || newGoal < 1) return;
      state.goal = newGoal;
      state.done = Math.min(state.done, state.goal);
      saveState(state);
      render();
      document.getElementById('settingsPanel').open = false;
    });

    resetBtn.addEventListener('click', () => {
      if (!confirm('Reset all progress? Your goal will be kept.')) return;
      state.done = 0;
      saveState(state);
      render();
    });

    // Allow Enter on goal input to save
    goalInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') saveGoalBtn.click();
    });

    render();
  </script>
</body>
</html>
